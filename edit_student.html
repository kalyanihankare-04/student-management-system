<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef4ff;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 11px 22px;
            margin: 10px 5px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>✏️ Edit Student</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   value="{{ student[1] }}"
                   required>

            <input type="text"
                   name="roll_no"
                   value="{{ student[2] }}"
                   required>

            <input type="text"
                   name="course"
                   value="{{ student[3] }}"
                   required>

            <input type="email"
                   name="email"
                   value="{{ student[4] }}"
                   required>

            <br>

            <button type="submit">Update Student</button>

        </form>

        <a href="/view_students">
            <button class="back">Back to Students</button>
        </a>

    </div>

</body>
</html>
