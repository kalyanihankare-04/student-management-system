<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 90%;
            background-color: white;
        }

        th {
            background-color: #333;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit {
            background-color: #2196F3;
            color: white;
        }

        .delete {
            background-color: #f44336;
            color: white;
        }

        .add {
            background-color: #4CAF50;
            color: white;
        }

        .home {
            background-color: #555;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Student List</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Course</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>

            <td>
                <a href="/edit_student/{{ student[0] }}">
                    <button class="edit">Edit</button>
                </a>

                <a href="/delete_student/{{ student[0] }}"
                   onclick="return confirm('Are you sure you want to delete this student?');">
                    <button class="delete">Delete</button>
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/add_student">
        <button class="add">Add Student</button>
    </a>

    &nbsp;

    <a href="/">
        <button class="home">Back to Home</button>
    </a>

</body>
</html>
