<!DOCTYPE html>
<html>
<head>
    <title>Student Management System - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef4ff;
            text-align: center;
            padding-top: 100px;
        }

        .login-box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Student Management System</h1>

        <h2>Login</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <br>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
